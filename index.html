<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PATBO — Expedição & Controle</title>
    <link rel="icon" type="image/png" href="public/logo-patbo.png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background-color: #000000;
        }

        /* Layout dividido: Sidebar à esquerda, Vídeo à direita */
        .app-layout {
            display: flex;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }

        /* Barra Lateral (Esquerda) */
        .sidebar {
            width: 380px;
            min-width: 340px;
            height: 100%;
            background: #FFFFFF;
            box-shadow: 6px 0 30px rgba(0, 0, 0, 0.2);
            z-index: 20;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 60px 40px;
            animation: slideInLeft 0.7s cubic-bezier(0.16, 1, 0.3, 1) both;
        }

        @keyframes slideInLeft {
            from {
                transform: translateX(-100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        /* Topo: Logo */
        .logo-container {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            padding-top: 20px;
        }

        .logo {
            max-width: 230px;
            height: auto;
            transition: transform 0.3s ease;
        }

        .logo:hover {
            transform: scale(1.03);
        }

        /* Miolo: Badge e Botão Entrar */
        .sidebar-middle {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 28px;
            margin: auto 0;
        }

        /* Badge EXPEDIÇÃO & CONTROLE */
        .badge-expedicao {
            display: inline-block;
            background: #EBF1F8;
            color: #1B365D;
            font-size: 11.5px;
            font-weight: 800;
            letter-spacing: 2.8px;
            text-transform: uppercase;
            padding: 8px 20px;
            border-radius: 30px;
            box-shadow: inset 0 0 0 1px rgba(27, 54, 93, 0.12);
        }

        /* Botão ENTRAR */
        .btn-entrar {
            width: 100%;
            padding: 18px 32px;
            background: #1B365D;
            color: #FFFFFF;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(27, 54, 93, 0.35);
            transition: all 0.25s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            text-decoration: none;
        }

        .btn-entrar:hover {
            background: #132742;
            transform: translateY(-2px);
            box-shadow: 0 14px 32px rgba(27, 54, 93, 0.45);
        }

        .btn-entrar:active {
            transform: translateY(0);
        }

        .btn-entrar svg {
            transition: transform 0.25s ease;
        }

        .btn-entrar:hover svg {
            transform: translateX(4px);
        }

        /* Rodapé da Sidebar */
        .sidebar-footer {
            text-align: center;
            padding-top: 20px;
            border-top: 1px solid #E2E8F0;
            width: 100%;
        }

        .sidebar-footer p {
            font-size: 11px;
            color: #94A3B8;
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        /* Área do Vídeo (Direita da Tela) */
        .video-section {
            flex: 1;
            height: 100%;
            position: relative;
            background: #0B1120;
            overflow: hidden;
        }

        .video-player {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* Overlay sutil sobre o vídeo */
        .video-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, rgba(0, 0, 0, 0.25) 0%, rgba(0, 0, 0, 0.05) 100%);
            pointer-events: none;
        }

        /* Responsividade */
        @media (max-width: 768px) {
            .app-layout {
                flex-direction: column;
            }

            .sidebar {
                width: 100%;
                min-width: auto;
                height: 50vh;
                padding: 30px 20px;
            }

            .video-section {
                height: 50vh;
            }
        }
    </style>
</head>
<body>

    <div class="app-layout">
        <!-- BARRA LATERAL (ESQUERDA) -->
        <aside class="sidebar">
            <!-- 1. O Logo -->
            <div class="logo-container">
                <img src="public/logo-patbo.png" onerror="this.onerror=null; this.src='../LOGO-PATBO-300x212.png'" alt="PATBO" class="logo">
            </div>

            <!-- 2. Expedição & Controle + Botão Iniciar -->
            <div class="sidebar-middle">
                <div class="badge-expedicao">
                    EXPEDIÇÃO & CONTROLE
                </div>

                <a href="app.html" class="btn-entrar" style="background: #1B365D;">
                    <span>Iniciar</span>
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                        <polyline points="12 5 19 12 12 19"></polyline>
                    </svg>
                </a>
            </div>

            <!-- 3. Rodapé Oficial -->
            <div class="sidebar-footer">
                <p>&copy; 2026 PATBO • Todos os direitos reservados</p>
            </div>
        </aside>

        <!-- SEÇÃO DO VÍDEO (DIREITA DA TELA) -->
        <main class="video-section">
            <video id="bgVideo" class="video-player" autoplay muted loop playsinline preload="auto" src="public/video-patbo.mp4">
                <source src="public/video-patbo.mp4" type="video/mp4">
                <source src="../Video - Patbo.mp4" type="video/mp4">
                <source src="./video-patbo.mp4" type="video/mp4">
            </video>
            <div class="video-overlay"></div>
        </main>
    </div>

    <script>
        function entrarSistema() {
            const sidebar = document.querySelector('.sidebar');
            sidebar.style.transition = 'transform 0.35s ease-in, opacity 0.35s ease-in';
            sidebar.style.transform = 'translateX(-100%)';
            sidebar.style.opacity = '0';
            
            setTimeout(() => {
                window.location.href = 'app.html';
            }, 300);
        }

        // Garantir que o vídeo reproduza sem bloqueios do navegador
        function startVideo() {
            const video = document.getElementById('bgVideo');
            if (video) {
                video.muted = true;
                video.defaultMuted = true;
                const playPromise = video.play();
                if (playPromise !== undefined) {
                    playPromise.catch(err => {
                        console.log('Autoplay aguardando interação do usuário:', err);
                        // Ativa a reprodução no primeiro movimento ou clique
                        const unlock = () => {
                            video.play().catch(() => {});
                            document.removeEventListener('click', unlock);
                            document.removeEventListener('mousemove', unlock);
                            document.removeEventListener('touchstart', unlock);
                        };
                        document.addEventListener('click', unlock);
                        document.addEventListener('mousemove', unlock);
                        document.addEventListener('touchstart', unlock);
                    });
                }
            }
        }

        document.addEventListener('DOMContentLoaded', startVideo);
        window.addEventListener('load', startVideo);

        // Tecla Enter para acessar
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                entrarSistema();
            }
        });
    </script>
</body>
</html>
